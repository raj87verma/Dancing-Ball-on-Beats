name: Build Android APK

# Manual trigger only - go to the "Actions" tab on GitHub and click
# "Run workflow" to start a build.
on:
  workflow_dispatch: {}

jobs:
  build-android:
    name: Build .apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UNITY_PROJECT_PATH: ${{ github.workspace }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      # Android builds need extra disk space on the GitHub-hosted runner
      # (Unity Editor + Android SDK/NDK can be 10+ GB combined).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Setup Unity (downloads the Editor + Android build support)
        id: unity-setup
        uses: buildalon/unity-setup@v2
        with:
          # Pinned to the 6000.0.x LTS line rather than the exact patch recorded in
          # ProjectVersion.txt, so this always resolves to a real, currently-downloadable
          # patch release instead of risking a stale/incorrect changeset hash.
          unity-version: 6000.0.x
          build-targets: Android

      - name: Activate Unity license (free Personal license)
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build Android APK
        uses: buildalon/unity-action@v3
        with:
          log-name: 'android-build'
          build-target: Android
          args: '-quit -batchmode -nographics -executeMethod DancingBallOnBeats.EditorTools.BuildScript.PerformAndroidBuild'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DancingBallOnBeats-apk
          path: Builds/Android/DancingBallOnBeats.apk
          retention-days: 14

      - name: Upload build log (only if something goes wrong)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: '**/android-build*.log'
          retention-days: 7
